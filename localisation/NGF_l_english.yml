l_english:
 NGF:0 "North German Federation"
 NGF_ADJ:0 "North German"
 form_north_german_federation_title:0 "Form the North German Federation"
 form_north_german_federation_desc:0 "With Lübeck, Berlin and Frankfurt under our control, we can unite the northern German states under one banner."
 ngf.1.t:0 "The North German Federation"
 ngf.1.d:0 "The northern German lands now stand united. Shall our people embrace new traditions as one federation, or keep faith with our old ways?"
 ngf.1.a:0 "Embrace new traditions!"
 ngf.1.b:0 "We keep our own traditions."
 ngf_old_traditions:0 "Old Traditions"
 desc_ngf_old_traditions:0 "We kept faith with our old ways."

 NGF_ideas:0 "North German Ideas"
 NGF_ideas_start:0 "Federal Ambitions"
 NGF_ideas_start_desc:0 "Under Prussian leadership, the northern states have cast aside their old rivalries. Together they will forge a Germany of iron resolve and steady administration."
 NGF_ideas_bonus:0 "Bundesdisziplin"
 NGF_ideas_bonus_desc:0 "Discipline is the backbone of the Federation. From the parade ground to the council chamber, order is everything."

 NGF_national_idea_1:0 "The Prussian Drill"
 NGF_national_idea_1_desc:0 "Endless hours on the parade square turn raw recruits into soldiers who fire, reload and march like a single machine."
 NGF_national_idea_2:0 "Spirit of the Bundesheer"
 NGF_national_idea_2_desc:0 "Men of Hanover, Saxony and Mecklenburg now march under one banner. Shared purpose steels the army's nerve in the hardest hour."
 NGF_national_idea_3:0 "Militarised Society"
 NGF_national_idea_3_desc:0 "From schoolboy to reservist, every citizen is taught that service to the state is a duty and an honour. The army and the nation have become one."
 NGF_national_idea_4:0 "Levy of the Confederation"
 NGF_national_idea_4_desc:0 "Every federal state contributes its quota of men, while the ports of the Baltic and North Sea supply a hardy pool of seamen."
 NGF_national_idea_5:0 "Federal Treasury"
 NGF_national_idea_5_desc:0 "A single budget and a trusted federal currency win the confidence of lenders. Credit flows more cheaply and prices stay stable."
 NGF_national_idea_6:0 "Bundesmarine"
 NGF_national_idea_6_desc:0 "The Hanseatic ports provide the crews, and Prussia provides the discipline. A new North German fleet takes shape in the Baltic."
 NGF_national_idea_7:0 "Customs Union"
 NGF_national_idea_7_desc:0 "Tariff walls between the states fall away, and goods move freely from the Rhine to the Memel. Merchants grow rich and the treasury grows with them."