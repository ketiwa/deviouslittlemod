# ---- Swiss ideas (German names) ----
 koenig_und_reichstag:0 "König und Reichstag"
 koenig_und_reichstag_desc:0 "The crown rules best with the consent of the estates. By binding king and diet together we secure a steady hand at the helm of state."
 schweizer_stahl:0 "Schweizer Stahl"
 schweizer_stahl_desc:0 "Our soldiers drill relentlessly and march in tight ranks, closing to point-blank range before delivering one devastating volley."
 hakkapeliten:0 "Die Hakkapeliten"
 hakkapeliten_desc:0 "Excellent horsemen and hardy mounts make our cavalry feared across Europe, while service in the saddle opens the way to wealth and honour."
 indelningswerk:0 "Indelningswerk"
 indelningswerk_desc:0 "By dividing the countryside into recruitment districts, every district must furnish and support its own soldiers, keeping our armies steadily manned."
 schweizer_absolutismus:0 "Schweizer Absolutismus"
 schweizer_absolutismus_desc:0 "A single guiding will must direct the state. The prince alone should command the government, unhindered by councils and assemblies."
 produktplakat:0 "Produktplakat"
 produktplakat_desc:0 "Foreign vessels may bring only their own goods and colonial wares to our harbours, reserving the carrying trade for our own merchants."
 vereinigungs_und_sicherheitsakte:0 "Vereinigungs- und Sicherheitsakte"
 vereinigungs_und_sicherheitsakte_desc:0 "The Act concentrates the power to wage war and make peace in the sovereign, strips the nobility of ancient privileges, and leaves the council dependent upon the crown."
