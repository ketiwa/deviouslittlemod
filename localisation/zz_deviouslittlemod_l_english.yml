 hes_renovate_frankfurt_title:0 "Renovate Frankfurt"
 hes_renovate_frankfurt_desc:0 "Frankfurt am Main is the beating heart of our realm. Let us turn it into a city worthy of our ambitions, investing in its buildings and development so that it may stand as a jewel of the Rhineland."
 flavor_hes.1.t:0 "The Renovation of Frankfurt"
 flavor_hes.1.d:0 "The work is complete. Frankfurt has been rebuilt and beautified, its markets bustling and its streets lined with fine new buildings. Our capital shines as a beacon of prosperity for all our subjects to admire."
 flavor_hes.1.a:0 "A city befitting our ambitions."
 emp_swi_renovate_konstanz_title:0 "Renovate Konstanz"
 emp_swi_renovate_konstanz_desc:0 "Konstanz lies at the crossroads of our Confederacy, on the shores of the lake that bears its name. Let us pour our wealth into its buildings and development, so that it may stand as a proud city of the Swiss."
 flavor_swi_konstanz.1.t:0 "The Renovation of Konstanz"
 flavor_swi_konstanz.1.d:0 "The renovations are complete. Konstanz stands renewed, its workshops busy and its streets prosperous. The city is now a worthy ornament of the Confederacy."
 flavor_swi_konstanz.1.a:0 "A city worthy of the Confederacy."
 swi_hold_all_claimed_lands_tt:0 "Every province claimed by §YConsolidate Switzerland§! is held by us or by our non-tributary subjects."
 until_frankfurt_sieged_desc:0 "until an enemy sieges or conquers the province of Frankfurt"
 until_konstanz_sieged_desc:0 "until an enemy sieges or conquers the province of Konstanz"
